name: Unit Tests

# Fast, hermetic unit tests (LLM output validation/normalization). No secrets,
# no browser, no DB — runs on every push/PR alongside the heavier E2E suite.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit
