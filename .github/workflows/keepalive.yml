name: Supabase Keepalive

on:
  schedule:
    # 매주 월/목 06:00 UTC (KST 15:00) — 7일 inactivity 한계 안에서 두 번 핑
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -tAc "SELECT 1"
